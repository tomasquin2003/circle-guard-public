apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: circleguard-dev
  labels:
    app: neo4j
    component: middleware
spec:
  type: ClusterIP
  selector:
    app: neo4j
    component: middleware
  ports:
    - name: http
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7687
      targetPort: 7687
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: circleguard-dev
  labels:
    app: neo4j
    component: middleware
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
      component: middleware
  template:
    metadata:
      labels:
        app: neo4j
        component: middleware
    spec:
      containers:
        - name: neo4j
          image: neo4j:5.26
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7474
            - containerPort: 7687
          env:
            # The official Neo4j image expects a single combined auth value.
            - name: NEO4J_AUTH
              value: neo4j/password
          volumeMounts:
            - name: neo4j-data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: 7687
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 7687
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
  volumeClaimTemplates:
    - metadata:
        name: neo4j-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi

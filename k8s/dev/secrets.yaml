# Academic/dev secret only. In production this should be replaced by a real
# secret manager integration such as External Secrets, Vault, AWS Secrets
# Manager or similar.
apiVersion: v1
kind: Secret
metadata:
  name: circleguard-dev-secrets
  namespace: circleguard-dev
type: Opaque
stringData:
  POSTGRES_USERNAME: admin
  POSTGRES_PASSWORD: password
  JWT_SECRET: my-super-secret-dev-key-32-chars-long-12345678
  NEO4J_USERNAME: neo4j
  NEO4J_PASSWORD: password
